[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webfetch"
version = "0.1.0"
description = "Web content extraction tool that fetches and converts web pages to Markdown, JSON, or TXT format"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Webfetch Team"}
]
keywords = ["web", "scraping", "markdown", "content-extraction", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
webfetch = "webfetch:main"

[project.urls]
Homepage = "https://github.com/webfetch/webfetch"
Documentation = "https://github.com/webfetch/webfetch#readme"
Repository = "https://github.com/webfetch/webfetch.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["webfetch*"]
